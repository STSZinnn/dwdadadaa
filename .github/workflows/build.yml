
name: Build Ultrabound SMP (Paper 1.21.11)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build Paper plugin
        shell: bash
        run: |
          set -o pipefail
          gradle clean build --no-daemon --console=plain 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UltraboundSMP-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload plugin JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UltraboundSMP-Paper-1.21.11-v0.1.1-alpha
          path: build/libs/UltraboundSMP-*.jar
          if-no-files-found: error
